server:
  port: 8090

spring:
  application:
    name: anti-dos-collector
  threads:
    virtual:
      enabled: true
  config:
    import:
      - "optional:classpath:collector-config.yaml"
      - "optional:file:collector-config.yaml"
      - "optional:file:../collector-config.yaml"
      - "optional:file:config/collector-config.yaml"
      - "optional:file:src/main/resources/collector-config.yaml"
      - "optional:file:collector/src/main/resources/collector-config.yaml"
      - "optional:file:/etc/antidos/collector-config.yaml"
      - "optional:file:${user.home}/.antidos/collector-config.yaml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:antidos-collector.db?busy_timeout=60000}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/sqlite

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

collector:
  config-file: ${COLLECTOR_CONFIG_FILE:collector-config.yaml}
  poll-interval-seconds: 15
  retention-days: 30
  active-event-retention-hours: ${COLLECTOR_ACTIVE_EVENT_RETENTION_HOURS:24}
  poll-log-retention-days: 1
  entity-retention-days: 60
  rollup-enabled: ${COLLECTOR_ROLLUP_ENABLED:true}
  rollup-window-minutes: ${COLLECTOR_ROLLUP_WINDOW_MINUTES:60}
  rollup-retention-days: ${COLLECTOR_ROLLUP_RETENTION_DAYS:30}
  low-activity-rollup-retention-days: ${COLLECTOR_LOW_ACTIVITY_ROLLUP_RETENTION_DAYS:7}
  low-activity-rollup-max-requests: ${COLLECTOR_LOW_ACTIVITY_ROLLUP_MAX_REQUESTS:5}
  auto-vacuum-enabled: ${COLLECTOR_AUTO_VACUUM_ENABLED:true}
  vacuum-threshold-bytes: ${COLLECTOR_VACUUM_THRESHOLD_BYTES:52428800}
  active-event-cleanup-cron: ${COLLECTOR_ACTIVE_EVENT_CLEANUP_CRON:0 15 * * * *}
  surge-min-requests: ${COLLECTOR_SURGE_MIN_REQUESTS:1000}
  surge-multiplier-alert: ${COLLECTOR_SURGE_MULTIPLIER_ALERT:5.0}
  slow-poll-threshold-ms: 1000
  demo-mode: ${COLLECTOR_DEMO_MODE:false}
  demo-instance-count: ${COLLECTOR_DEMO_INSTANCE_COUNT:1}
  enrichment:
    enabled: true
    ttl-days: 30
    crawler-sync-enabled: true
    crawler-sync-cron: "0 0 4 * * *"
    crawler-retry-cron: "0 15 * * * *"
    crawler-feeds:
      googlebot:
        name: "Googlebot"
        category: "SEARCH_ENGINE"
        url: "https://developers.google.com/search/apis/ipranges/googlebot.json"
        enabled: true
      google-special-crawlers:
        name: "Google Special Crawlers"
        category: "SEARCH_ENGINE"
        url: "https://developers.google.com/search/apis/ipranges/special-crawlers.json"
        enabled: true
      bingbot:
        name: "Bingbot"
        category: "SEARCH_ENGINE"
        url: "https://www.bing.com/toolbox/bingbot.json"
        enabled: true
      applebot:
        name: "Applebot"
        category: "SEARCH_ENGINE"
        url: "https://search.developer.apple.com/applebot.json"
        enabled: true
      duckduckbot:
        name: "DuckDuckBot"
        category: "SEARCH_ENGINE"
        url: "https://duckduckgo.com/duckduckbot.json"
        enabled: true
      openai-gptbot:
        name: "OpenAI GPTBot"
        category: "AI_CRAWLER"
        url: "https://openai.com/gptbot.json"
        enabled: true
      openai-searchbot:
        name: "OpenAI SearchBot"
        category: "AI_CRAWLER"
        url: "https://openai.com/searchbot.json"
        enabled: true
      openai-chatgpt-user:
        name: "ChatGPT User"
        category: "AI_CRAWLER"
        url: "https://openai.com/chatgpt-user.json"
        enabled: true
      anthropic-ai:
        name: "Anthropic ClaudeBot"
        category: "AI_CRAWLER"
        url: "https://claude.com/crawling/bots.json"
        enabled: true
      perplexitybot:
        name: "PerplexityBot"
        category: "AI_CRAWLER"
        url: "https://www.perplexity.ai/perplexitybot.json"
        enabled: true
      perplexity-user:
        name: "Perplexity User"
        category: "AI_CRAWLER"
        url: "https://www.perplexity.ai/perplexity-user.json"
        enabled: true
      duckassistbot:
        name: "DuckAssistBot"
        category: "AI_CRAWLER"
        url: "https://duckduckgo.com/duckassistbot.json"
        enabled: true
      icloud-private-relay:
        name: "Apple iCloud Private Relay"
        category: "PRIVACY_RELAY"
        url: "https://mask-api.icloud.com/egress-ip-ranges.csv"
        enabled: true
      tor-exit-nodes:
        name: "Tor Bulk Exit Nodes"
        category: "TOR_EXIT_NODE"
        url: "https://check.torproject.org/torbulkexitlist"
        enabled: true
