server:
  port: 8090

spring:
  application:
    name: anti-dos-collector
  threads:
    virtual:
      enabled: true
  config:
    import:
      - "optional:classpath:collector-config.yaml"
      - "optional:file:collector-config.yaml"
      - "optional:file:../collector-config.yaml"
      - "optional:file:config/collector-config.yaml"
      - "optional:file:src/main/resources/collector-config.yaml"
      - "optional:file:collector/src/main/resources/collector-config.yaml"
      - "optional:file:/etc/antidos/collector-config.yaml"
      - "optional:file:${user.home}/.antidos/collector-config.yaml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:antidos-collector.db?busy_timeout=60000}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/sqlite

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

collector:
  config-file: ${COLLECTOR_CONFIG_FILE:collector-config.yaml}
  mode: ${COLLECTOR_MODE:FULL}
  viewer-migrate-on-startup: ${COLLECTOR_VIEWER_MIGRATE_ON_STARTUP:false}
  poll-interval-seconds: 15
  retention-days: 30
  active-event-retention-hours: ${COLLECTOR_ACTIVE_EVENT_RETENTION_HOURS:24}
  poll-log-retention-days: 1
  entity-retention-days: 60
  rollup-enabled: ${COLLECTOR_ROLLUP_ENABLED:true}
  rollup-window-minutes: ${COLLECTOR_ROLLUP_WINDOW_MINUTES:60}
  rollup-retention-days: ${COLLECTOR_ROLLUP_RETENTION_DAYS:30}
  low-activity-rollup-retention-days: ${COLLECTOR_LOW_ACTIVITY_ROLLUP_RETENTION_DAYS:7}
  low-activity-rollup-max-requests: ${COLLECTOR_LOW_ACTIVITY_ROLLUP_MAX_REQUESTS:5}
  auto-vacuum-enabled: ${COLLECTOR_AUTO_VACUUM_ENABLED:true}
  vacuum-threshold-bytes: ${COLLECTOR_VACUUM_THRESHOLD_BYTES:52428800}
  active-event-cleanup-cron: ${COLLECTOR_ACTIVE_EVENT_CLEANUP_CRON:0 15 * * * *}
  surge-min-requests: ${COLLECTOR_SURGE_MIN_REQUESTS:1000}
  surge-multiplier-alert: ${COLLECTOR_SURGE_MULTIPLIER_ALERT:5.0}
  slow-poll-threshold-ms: 1000
  max-catch-up-slots-per-poll: ${COLLECTOR_MAX_CATCH_UP_SLOTS_PER_POLL:2}
  max-catch-up-lag-slots: ${COLLECTOR_MAX_CATCH_UP_LAG_SLOTS:6}
  endpoint-poll-timeout-ms: ${COLLECTOR_ENDPOINT_POLL_TIMEOUT_MS:25000}
  host-concurrency-timeout-seconds: ${COLLECTOR_HOST_CONCURRENCY_TIMEOUT_SECONDS:15}
  demo-mode: ${COLLECTOR_DEMO_MODE:false}
  demo-instance-count: ${COLLECTOR_DEMO_INSTANCE_COUNT:1}

  # Authentication, API authorization & AI-Agent guardrails
  security:
    require-auth-for-read: ${COLLECTOR_REQUIRE_AUTH_FOR_READ:true}
    api-enabled: ${COLLECTOR_API_ENABLED:true}
    session-ttl-seconds: ${COLLECTOR_SESSION_TTL_SECONDS:28800}
    max-auth-failures: ${COLLECTOR_MAX_AUTH_FAILURES:5}
    auth-lockout-seconds: ${COLLECTOR_AUTH_LOCKOUT_SECONDS:300}
    ai-guardrails:
      max-ttl-minutes: ${COLLECTOR_AI_MAX_TTL_MINUTES:120}
      max-blocks-per-hour: ${COLLECTOR_AI_MAX_BLOCKS_PER_HOUR:20}
      min-reason-length: ${COLLECTOR_AI_MIN_REASON_LENGTH:15}
      allow-asn-batch-block: ${COLLECTOR_AI_ALLOW_ASN_BATCH_BLOCK:false}
      min-ipv4-prefix: ${COLLECTOR_AI_MIN_IPV4_PREFIX:24}
      min-ipv6-prefix: ${COLLECTOR_AI_MIN_IPV6_PREFIX:48}

  # Embedded AntiDoSValve protecting Collector's own Tomcat HTTP listener
  self-protection:
    enabled: ${COLLECTOR_SELF_PROTECTION_ENABLED:true}
    monitor-name: ${COLLECTOR_SELF_PROTECTION_MONITOR_NAME:Collector-Self-Protection}
    slot-length: ${COLLECTOR_SELF_PROTECTION_SLOT_LENGTH:60}
    number-of-slots: ${COLLECTOR_SELF_PROTECTION_NUMBER_OF_SLOTS:5}
    allowed-requests-per-slot: ${COLLECTOR_SELF_PROTECTION_ALLOWED_REQUESTS_PER_SLOT:600}
    share-of-retained-former-requests: ${COLLECTOR_SELF_PROTECTION_RETAINED_SHARE:0.25}
    max-ip-cache-size: ${COLLECTOR_SELF_PROTECTION_MAX_IP_CACHE_SIZE:10000}
    ipv4-subnet-mask: ${COLLECTOR_SELF_PROTECTION_IPV4_MASK:32}
    ipv6-subnet-mask: ${COLLECTOR_SELF_PROTECTION_IPV6_MASK:64}
    non-relevant-paths: ${COLLECTOR_SELF_PROTECTION_NON_RELEVANT_PATHS:.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|svg)$}
    always-allow-private-ips: ${COLLECTOR_SELF_PROTECTION_ALWAYS_ALLOW_PRIVATE_IPS:false}
  enrichment:
    enabled: true
    ttl-days: 30
    crawler-sync-enabled: true
    crawler-sync-cron: "0 0 4 * * *"
    crawler-retry-cron: "0 15 * * * *"
    crawler-feeds:
      googlebot:
        name: "Googlebot"
        category: "SEARCH_ENGINE"
        url: "https://developers.google.com/search/apis/ipranges/googlebot.json"
        enabled: true
      google-special-crawlers:
        name: "Google Special Crawlers"
        category: "SEARCH_ENGINE"
        url: "https://developers.google.com/search/apis/ipranges/special-crawlers.json"
        enabled: true
      bingbot:
        name: "Bingbot"
        category: "SEARCH_ENGINE"
        url: "https://www.bing.com/toolbox/bingbot.json"
        enabled: true
      applebot:
        name: "Applebot"
        category: "SEARCH_ENGINE"
        url: "https://search.developer.apple.com/applebot.json"
        enabled: true
      duckduckbot:
        name: "DuckDuckBot"
        category: "SEARCH_ENGINE"
        url: "https://duckduckgo.com/duckduckbot.json"
        enabled: true
      linkupbot:
        name: "LinkupBot"
        category: "SEARCH_ENGINE"
        url: "https://www.linkup.so/linkupbot-ips.txt"
        enabled: true
      openai-gptbot:
        name: "OpenAI GPTBot"
        category: "AI_CRAWLER"
        url: "https://openai.com/gptbot.json"
        enabled: true
      openai-searchbot:
        name: "OpenAI SearchBot"
        category: "AI_CRAWLER"
        url: "https://openai.com/searchbot.json"
        enabled: true
      openai-chatgpt-user:
        name: "ChatGPT User"
        category: "AI_CRAWLER"
        url: "https://openai.com/chatgpt-user.json"
        enabled: true
      anthropic-ai:
        name: "Anthropic ClaudeBot"
        category: "AI_CRAWLER"
        url: "https://claude.com/crawling/bots.json"
        enabled: true
      perplexitybot:
        name: "PerplexityBot"
        category: "AI_CRAWLER"
        url: "https://www.perplexity.ai/perplexitybot.json"
        enabled: true
      perplexity-user:
        name: "Perplexity User"
        category: "AI_CRAWLER"
        url: "https://www.perplexity.ai/perplexity-user.json"
        enabled: true
      duckassistbot:
        name: "DuckAssistBot"
        category: "AI_CRAWLER"
        url: "https://duckduckgo.com/duckassistbot.json"
        enabled: true
      icloud-private-relay:
        name: "Apple iCloud Private Relay"
        category: "PRIVACY_RELAY"
        url: "https://mask-api.icloud.com/egress-ip-ranges.csv"
        enabled: true
      tor-exit-nodes:
        name: "Tor Bulk Exit Nodes"
        category: "TOR_EXIT_NODE"
        url: "https://check.torproject.org/torbulkexitlist"
        enabled: true
  browser-reference:
    enabled: ${COLLECTOR_BROWSER_REFERENCE_ENABLED:true}
    chrome-api-url: ${COLLECTOR_BROWSER_CHROME_API_URL:https://versionhistory.googleapis.com/v1/chrome/platforms/all/channels/all/versions}
    firefox-api-url: ${COLLECTOR_BROWSER_FIREFOX_API_URL:https://product-details.mozilla.org/1.0/firefox_versions.json}
    sync-interval-hours: ${COLLECTOR_BROWSER_SYNC_INTERVAL_HOURS:24}
    safari-versions:
      - "27.2 STP"
      - "26.6"
      - "26.1"
      - "18.6"
      - "17.6"
  user-agent-heuristics:
    internal-immunity-min-ratio-pct: ${COLLECTOR_UA_INTERNAL_MIN_RATIO_PCT:5.0}
    internal-immunity-min-requests: ${COLLECTOR_UA_INTERNAL_MIN_REQUESTS:100}
    search-engine-immunity-min-ratio-pct: ${COLLECTOR_UA_SEARCH_ENGINE_MIN_RATIO_PCT:50.0}
    auth-immunity-min-sample-ratio-pct: ${COLLECTOR_UA_AUTH_MIN_SAMPLE_RATIO_PCT:1.0}
    auth-immunity-min-slot-ratio-pct: ${COLLECTOR_UA_AUTH_MIN_SLOT_RATIO_PCT:2.0}
    spread-min-requests: ${COLLECTOR_UA_SPREAD_MIN_REQUESTS:2500}
    spread-min-subnets: ${COLLECTOR_UA_SPREAD_MIN_SUBNETS:100}
    spread-min-asns: ${COLLECTOR_UA_SPREAD_MIN_ASNS:20}
    spread-max-avg-slot-requests: ${COLLECTOR_UA_SPREAD_MAX_AVG_SLOT_REQUESTS:10.0}
    spread-min-version-lag-majors: ${COLLECTOR_UA_SPREAD_MIN_VERSION_LAG_MAJORS:2}
    correlated-min-requests: ${COLLECTOR_UA_CORRELATED_MIN_REQUESTS:2000}
    correlated-min-incident-ratio-pct: ${COLLECTOR_UA_CORRELATED_MIN_INCIDENT_RATIO_PCT:30.0}
    correlated-min-mitigated-asn-ratio-pct: ${COLLECTOR_UA_CORRELATED_MIN_MITIGATED_ASN_RATIO_PCT:40.0}
    correlated-min-ua-mismatch-ratio-pct: ${COLLECTOR_UA_CORRELATED_MIN_MISMATCH_RATIO_PCT:20.0}
    datacenter-min-requests: ${COLLECTOR_UA_DATACENTER_MIN_REQUESTS:1500}
    datacenter-min-ratio-pct: ${COLLECTOR_UA_DATACENTER_MIN_RATIO_PCT:80.0}


