server:
  port: 8090

spring:
  application:
    name: anti-dos-collector
  threads:
    virtual:
      enabled: true
  config:
    import:
      - "optional:classpath:collector-config.yaml"
      - "optional:file:collector-config.yaml"
      - "optional:file:../collector-config.yaml"
      - "optional:file:config/collector-config.yaml"
      - "optional:file:src/main/resources/collector-config.yaml"
      - "optional:file:collector/src/main/resources/collector-config.yaml"
      - "optional:file:/etc/antidos/collector-config.yaml"
      - "optional:file:${user.home}/.antidos/collector-config.yaml"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:antidos-collector.db?busy_timeout=10000}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/sqlite

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

collector:
  config-file: ${COLLECTOR_CONFIG_FILE:collector-config.yaml}
  poll-interval-seconds: 15
  retention-days: 30
  poll-log-retention-days: 1
  entity-retention-days: 60
  slow-poll-threshold-ms: 1000
  demo-mode: ${COLLECTOR_DEMO_MODE:false}
  enrichment:
    enabled: true
    ttl-days: 30
    crawler-sync-enabled: true
    crawler-sync-cron: "0 0 4 * * *"
    crawler-feeds:
      googlebot:
        name: "Googlebot"
        category: "SEARCH_ENGINE"
        url: "https://developers.google.com/search/apis/ipranges/googlebot.json"
        enabled: true
      bingbot:
        name: "Bingbot"
        category: "SEARCH_ENGINE"
        url: "https://www.bing.com/toolbox/bingbot.json"
        enabled: true
      applebot:
        name: "Applebot"
        category: "SEARCH_ENGINE"
        url: "https://search.developer.apple.com/applebot.json"
        enabled: true
      openai-gptbot:
        name: "OpenAI GPTBot"
        category: "AI_CRAWLER"
        url: "https://openai.com/gptbot.json"
        enabled: true
      openai-chatgpt-user:
        name: "ChatGPT User"
        category: "AI_CRAWLER"
        url: "https://openai.com/chatgpt-user.json"
        enabled: true
      tor-exit-nodes:
        name: "Tor Bulk Exit Nodes"
        category: "TOR_EXIT_NODE"
        url: "https://check.torproject.org/torbulkexitlist"
        enabled: true
