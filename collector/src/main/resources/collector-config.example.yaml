# Anti-DoS Collector - Fleet Endpoint Configuration
#
# Supported configuration locations (checked automatically on startup):
#   1. System-wide production: /etc/antidos/collector-config.yaml
#   2. User-home directory:    ~/.antidos/collector-config.yaml
#   3. Working directory:      ./collector-config.yaml (git-ignored)
#   4. Command-line override:  --spring.config.additional-location=file:/custom/path/collector-config.yaml
#
# -----------------------------------------------------------------------------
# Optional: Database Storage Location / Engine
# -----------------------------------------------------------------------------
# By default, SQLite stores data in 'antidos-collector.db' in the current working directory.
# In production, specify an absolute system path or user home directory to decouple data from code:
#
# spring:
#   datasource:
#     url: "jdbc:sqlite:/var/lib/antidos/antidos-collector.db?busy_timeout=10000"
#     # Or in user home:
#     # url: "jdbc:sqlite:${user.home}/.antidos/antidos-collector.db?busy_timeout=10000"
#
# Or switch to PostgreSQL for high-volume enterprise deployments:
# spring:
#   datasource:
#     url: "jdbc:postgresql://localhost:5432/antidos_collector"
#     username: "postgres"
#     password: "secretpassword"
#     driver-class-name: "org.postgresql.Driver"

collector:
  # Global default poll interval in seconds
  poll-interval-seconds: 15

  # Historical retention period for completed slots and client events
  retention-days: 30

  # Retention period for inactive unreferenced network entities (default: 60 days)
  entity-retention-days: 60

  # Retention period for the polling event audit log (default: 1 day)
  poll-log-retention-days: 1

  # Latency threshold in ms before marking a poll cycle as WARNING (default: 1000 ms)
  slow-poll-threshold-ms: 1000

  # Concurrently poll fleet endpoints in parallel using Java 21 Virtual Threads (default: true)
  # When enabled, slow or unreachable servers do not delay polling for other servers in the fleet.
  # Requests to valves on the same server always remain sequential to avoid load spikes on that host.
  parallel-fleet-polling: true

  # List of monitored Tomcat servers running AntiDoSValve
  endpoints:
    # Example 1: Local Tomcat instance - polls all valves by default
    - name: "Local-Tomcat"
      url: "http://localhost:8080/antidos-status"
      token: "secretToken1"
      poll-intermediate-slots: false
      enabled: true

    # Example 2: Remote Production Node with specific valve filtering
    # Only the listed valves are polled. If 'valves' is omitted or empty, all valves are polled.
    # Useful to ignore pure monitoring-only valves (e.g. "STATUS VALVE").
    - name: "Prod-Web-01"
      url: "https://web01.internal.example.com/antidos-status"
      token: "productionStatusToken123"
      poll-intermediate-slots: true
      enabled: false
      valves:
        - "IP-Aggregator"
        - "Subnet-24-Limiter"

    # Example 3: Additional cluster node
    - name: "Prod-Web-02"
      url: "https://web02.internal.example.com/antidos-status"
      token: "productionStatusToken456"
      poll-intermediate-slots: true
      enabled: false

  # ---------------------------------------------------------------------------
  # Optional: IP Enrichment, ASN/Country Lookups & Bot Classification
  # ---------------------------------------------------------------------------
  enrichment:
    enabled: true
    # Metadata freshness TTL in days (MaxMind GeoLite2 compliance, default: 30 days):
    # Entities resolved longer than ttl-days ago are automatically scheduled for re-enrichment.
    ttl-days: 30

    # Paths to offline binary MMDB databases (DB-IP Lite or MaxMind GeoLite2):
    # asn-database-path: "/var/lib/antidos/dbip-asn-lite.mmdb"         # or /usr/share/GeoIP/GeoLite2-ASN.mmdb
    # country-database-path: "/var/lib/antidos/dbip-country-lite.mmdb" # or /usr/share/GeoIP/GeoLite2-Country.mmdb

    # Custom datacenter ASN overlay file (add with +12345, exclude with -24940):
    custom-datacenter-asns-file: "custom-datacenter-asns.txt"

    # Automated daily sync of verified Search Engine, AI crawler & Tor exit IP ranges:
    crawler-sync-enabled: true
    crawler-sync-cron: "0 0 4 * * *"

    # Crawler & Anonymizer IP range feeds:
    # Default feeds out-of-the-box (Googlebot, Bingbot, Applebot, OpenAI, ChatGPT, Tor Exit Nodes)
    # are defined in application.yaml and automatically merged with your custom feeds below.
    # Supported categories: SEARCH_ENGINE, AI_CRAWLER, TOR_EXIT_NODE
    # (Feeds with unknown categories will log a warning and remain disabled as INVALID_CONFIG).
    #
    # crawler-feeds:
    #   # Example 1: Add a custom partner or internal search crawler feed:
    #   custom-crawler:
    #     name: "Partner API Crawler"
    #     category: "SEARCH_ENGINE"
    #     url: "https://partner.example.com/crawler-ips.json"
    #     enabled: true
    #
    #   # Example 2: Disable a default feed (e.g. OpenAI) without affecting others:
    #   # openai-gptbot:
    #   #   enabled: false
    #
    #   # Example 3: Override URL of Tor Bulk Exit list (e.g. internal mirror):
    #   # tor-exit-nodes:
    #   #   url: "https://internal-mirror.local/torbulkexitlist"
