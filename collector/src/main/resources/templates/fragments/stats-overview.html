<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment: statsOverview -->
<section th:fragment="statsOverview" class="stats-grid" id="stats-overview">
    <div class="stat-card">
        <div class="stat-label">Monitored Servers</div>
        <div class="stat-value primary">
            <span th:text="${fleetSummary.onlineEndpoints}">0</span>
            <span style="font-size:16px; color:var(--text-muted);" th:text="' / ' + ${fleetSummary.totalEndpoints}"> / 0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Valves</div>
        <div class="stat-value success" th:text="${fleetSummary.totalValvesMonitored}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Total Requests (24h)</div>
        <div class="stat-value" th:text="${#numbers.formatInteger(fleetSummary.totalRequests24h, 1, 'POINT')}">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Blocked Requests (24h)</div>
        <div class="stat-value danger" th:text="${#numbers.formatInteger(fleetSummary.totalBlockedRequests24h, 1, 'POINT')}">0</div>
    </div>
    <div class="stat-card" th:if="${fleetSummary.totalMarkedRequests24h > 0}">
        <div class="stat-label">Marked Requests (24h)</div>
        <div class="stat-value purple">
            <span th:text="${#numbers.formatInteger(fleetSummary.totalMarkedRequests24h, 1, 'POINT')}">0</span>
            <span th:if="${fleetSummary.distinctMarkedClients24h > 0}" style="font-size:14px; opacity:0.85; margin-left:4px;" th:text="'(' + ${fleetSummary.distinctMarkedClients24h} + ' IPs)'"></span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Unique Blocked IPs (24h)</div>
        <div class="stat-value warning" th:text="${fleetSummary.distinctBlockedClients24h}">0</div>
    </div>
</section>

</body>
</html>
