<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Crawlers &amp; Bot Feeds - Anti-DoS Collector</title>
    <link rel="stylesheet" th:href="@{/css/collector.css}">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/htmx-lite.js}" defer></script>
</head>
<body>

<div class="app-container">
    <!-- Navbar -->
    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon">&#x1F6E1;</div>
            <div>
                <div class="brand-title">Anti-DoS Fleet Manager</div>
                <div class="brand-subtitle">Crawler &amp; Bot Verification Feeds</div>
            </div>
        </a>
        <div class="nav-actions">
            <a href="/" class="btn">
                <span>&#x2190;</span> Dashboard
            </a>
            <a href="/events" class="btn" title="View individual incident events log">
                <span>&#x1F4CB;</span> Incident Explorer
            </a>
            <a href="/offenders" class="btn" title="View aggregated high-volume offenders and ASN rollup">
                <span>&#x26A0;</span> Top Offenders
            </a>
            <a href="/poll-log" class="btn" title="View polling event audit log">
                <span>&#x1F4DC;</span> Event Log
            </a>
            <a href="/system" class="btn" title="System status, telemetry rules &amp; configuration">
                <span>&#x2699;</span> System &amp; Config
            </a>
            <a href="/help" class="btn" title="Documentation, configuration reference & forensics guide">
                <span>&#x2753;</span> Help &amp; Guide
            </a>
            <button type="button" class="btn btn-theme-toggle" onclick="toggleTheme()" title="Switch Light / Dark Theme" aria-label="Toggle theme">
                <span class="theme-icon-sun">&#x2600;&#xFE0F;</span>
                <span class="theme-icon-moon">&#x1F319;</span>
            </button>
        </div>
    </header>

    <!-- Header & Action -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
        <div>
            <div class="section-title">
                <span>&#x1F916;</span> Verified Search Engine &amp; AI Crawler Feeds
            </div>
            <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                Dynamic IP range synchronization and classification for legitimate search crawlers and AI bots
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn"
                    style="background: var(--color-primary); color: white; border: none; font-weight: 600;"
                    hx-post="/crawlers/sync-all"
                    hx-target="#crawlers-table-container"
                    hx-swap="outerHTML">
                &#x21BB; Synchronize All Feeds Now
            </button>
        </div>
    </div>

    <!-- Crawlers Table -->
    <div th:replace="~{fragments/crawlers-table :: crawlersTable}"></div>
</div>

</body>
</html>
